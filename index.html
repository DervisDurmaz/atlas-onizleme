    <!-- The theme of the shell (ADR-0050), on the root element before anything is painted: the light one

         two themes (tokens.css), so the first paint is the theme's own ground and never a flash of the
         other; the browser chrome takes the same colour (theme.test.ts holds these values to the tokens). -->
    <meta name="theme-color" content="#f2f4f7" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        var theme = 'light';
        try {
          if (window.localStorage.getItem('marikultur-atlas:theme') === 'dark') theme = 'dark';
        } catch (e) {
          /* no storage: the default theme on each load */
        }
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#081827');
      })();
    </script>
